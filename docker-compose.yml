# Local Postgres for the API. Start: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lino
      POSTGRES_PASSWORD: lino
      POSTGRES_DB: lino
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
